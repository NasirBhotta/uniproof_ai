[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="france-admission-agent"
version="0.3.0"
requires-python=">=3.11"
dependencies=["langgraph","pydantic>=2","python-dotenv","httpx","beautifulsoup4"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
